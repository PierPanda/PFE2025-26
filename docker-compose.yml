services:
  postgres:
    image: postgres:16-alpine
    container_name: maestro-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maestro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: maestro-app
    restart: unless-stopped
    ports:
      - '3005:3000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: node ./node_modules/@react-router/serve/dist/cli.js ./build/server/index.js

volumes:
    postgres_data: